    // ===================== ESTADO =====================
    let selectedAnswers = {};
    let currentStudent = null;
    let currentClass = '9A';

    const container = document.getElementById('questionsContainer');
    const studentSelect = document.getElementById('studentSelect');
    const classSelect = document.getElementById('classSelect');
    const nDisplay = document.getElementById('nDisplay');
    const raDisplay = document.getElementById('raDisplay');
    const emailDisplay = document.getElementById('emailDisplay');

    // ===================== ELEMENTOS DO MODAL =====================
    const modal = document.getElementById('imageModal');
    const modalImage = document.getElementById('modalImage');
    const modalClose = document.getElementById('modalCloseBtn');

    // ===================== FUNÇÃO PARA ABRIR MODAL =====================
    function openModal(imageSrc) {
      modalImage.src = imageSrc;
      modal.classList.add('active');
      document.body.style.overflow = 'hidden'; // Impede scroll da página
    }

    // ===================== FUNÇÃO PARA FECHAR MODAL =====================
    function closeModal() {
      modal.classList.remove('active');
      document.body.style.overflow = ''; // Restaura scroll
    }

    // ===================== EVENTOS DO MODAL =====================
    // Fechar ao clicar no botão X
    modalClose.addEventListener('click', function(e) {
      e.stopPropagation();
      closeModal();
    });

    // Fechar ao clicar no overlay (fundo escuro)
    modal.addEventListener('click', function(e) {
      if (e.target === modal) {
        closeModal();
      }
    });

    // Fechar ao pressionar ESC
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && modal.classList.contains('active')) {
        closeModal();
      }
    });

    // ===================== POPULAR SELECT DE ALUNOS =====================
    function populateStudentSelect() {
      studentSelect.innerHTML = '<option value="">— selecione —</option>';
      students.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = `${s.id} - ${s.nome}`;
        studentSelect.appendChild(opt);
      });
    }
    populateStudentSelect();

    // ===================== ATUALIZAR INFOS DO ALUNO =====================
    function updateStudentInfo() {
      const id = parseInt(studentSelect.value);
      if (id) {
        currentStudent = students.find(s => s.id === id);
        if (currentStudent) {
          nDisplay.textContent = `Nº: ${currentStudent.id}`;
          raDisplay.textContent = `RA: ${currentStudent.ra}-${currentStudent.dig}`;
          emailDisplay.textContent = `E-mail: ${currentStudent.email || '—'}`;
        }
      } else {
        currentStudent = null;
        nDisplay.textContent = 'Nº: —';
        raDisplay.textContent = 'RA: —';
        emailDisplay.textContent = 'E-mail: —';
      }
    }

    studentSelect.addEventListener('change', updateStudentInfo);

    // ===================== RENDERIZAR QUESTÕES =====================
    function renderQuestions() {
      container.innerHTML = '';
      questionsData.forEach((q, idx) => {
        const qDiv = document.createElement('div');
        qDiv.className = 'question';
        qDiv.dataset.qid = q.id;

        const header = document.createElement('div');
        header.className = 'q-header';
        header.innerHTML = `
          <span class="q-number">Questão ${idx+1}</span>
          <span class="q-type">${q.type === 'multiple' ? 'Múltipla escolha' : 'Dissertativa'} · ${q.aula}</span>
        `;
        qDiv.appendChild(header);

        const textP = document.createElement('div');
        textP.className = 'q-text';
        textP.textContent = q.text;
        qDiv.appendChild(textP);

        if (q.context) {
          const ctx = document.createElement('div');
          ctx.className = 'q-context';
          ctx.textContent = q.context;
          qDiv.appendChild(ctx);
        }

        if (q.image) {
          const img = document.createElement('img');
          img.src = q.image;
          img.className = 'q-img';
          img.alt = 'Ilustração da questão - Clique para ampliar';
          img.title = 'Clique para ampliar a imagem';
          // ===== EVENTO DE CLIQUE PARA AMPLIAR =====
          img.addEventListener('click', function(e) {
            e.stopPropagation();
            openModal(this.src);
          });
          qDiv.appendChild(img);
        }

        if (q.type === 'multiple') {
          const optDiv = document.createElement('div');
          optDiv.className = 'options';
          const letters = ['A', 'B', 'C', 'D'];
          q.options.forEach((optText, i) => {
            const opt = document.createElement('div');
            opt.className = 'opt';
            opt.dataset.index = i;
            opt.innerHTML = `<span class="letter">${letters[i]}</span> <span>${optText}</span>`;
            if (selectedAnswers[q.id] === i) opt.classList.add('selected');
            opt.addEventListener('click', function() {
              const parent = this.closest('.options');
              parent.querySelectorAll('.opt').forEach(el => el.classList.remove('selected'));
              this.classList.add('selected');
              selectedAnswers[q.id] = parseInt(this.dataset.index);
            });
            optDiv.appendChild(opt);
          });
          qDiv.appendChild(optDiv);
        } else {
          const essayDiv = document.createElement('div');
          essayDiv.className = 'essay-area';
          const textarea = document.createElement('textarea');
          textarea.placeholder = 'Escreva sua resposta aqui...';
          if (selectedAnswers[q.id]) textarea.value = selectedAnswers[q.id];
          textarea.addEventListener('input', function() {
            selectedAnswers[q.id] = this.value;
          });
          essayDiv.appendChild(textarea);
          qDiv.appendChild(essayDiv);
        }
        container.appendChild(qDiv);
      });
    }

    // ===================== ENVIAR PARA GOOGLE SHEETS =====================
    function sendToSheets() {
      if (!currentStudent) {
        alert('Por favor, selecione um aluno na lista.');
        return;
      }

      let missing = false;
      questionsData.forEach(q => {
        if (q.type === 'multiple') {
          if (selectedAnswers[q.id] === undefined || selectedAnswers[q.id] === null) missing = true;
        } else {
          if (!selectedAnswers[q.id] || selectedAnswers[q.id].trim() === '') missing = true;
        }
      });
      if (missing) {
        if (!confirm('Ainda há questões não respondidas. Deseja enviar mesmo assim?')) return;
      }

      const payload = {
        student: currentStudent.nome,
        numero: currentStudent.id,
        ra: `${currentStudent.ra}-${currentStudent.dig}`,
        class: currentClass,
        studentId: currentStudent.id,
        answers: {}
      };
      questionsData.forEach(q => {
        if (q.type === 'multiple') {
          const idx = selectedAnswers[q.id];
          payload.answers[q.id] = (idx !== undefined && idx !== null) ? idx : -1;
        } else {
          payload.answers[q.id] = selectedAnswers[q.id] || '';
        }
      });

      const scriptUrl = 'https://script.google.com/macros/s/AKfycbx_Rf6RNHlNWcPu8mcwHyzicKNavms8UFTyvimewKJxl4fK2XRhUbTA2TqQlGrX6e_P/exec';

      fetch(scriptUrl, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        alert('✅ Respostas enviadas com sucesso!');
        console.log('Enviado:', payload);
      })
      .catch(err => {
        alert('❌ Erro ao enviar. Verifique a URL do AppScript.');
        console.error(err);
      });
    }

    // ===================== REINICIAR =====================
    function resetQuiz() {
      if (!confirm('Tem certeza que deseja reiniciar todas as respostas?')) return;
      selectedAnswers = {};
      renderQuestions();
      document.querySelectorAll('.essay-area textarea').forEach(ta => ta.value = '');
      document.querySelectorAll('.opt').forEach(el => el.classList.remove('selected'));
    }

    // ===================== EVENTOS =====================
    document.getElementById('sendBtn').addEventListener('click', sendToSheets);
    document.getElementById('resetBtn').addEventListener('click', resetQuiz);

    // ===================== INICIALIZAÇÃO =====================
    renderQuestions();
    updateStudentInfo();
  })();
</script>
